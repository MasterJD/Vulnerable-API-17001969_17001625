services:
  vulnerable_node:
    restart: always
    build: .
    depends_on:
      postgres_db:
        condition: service_healthy
    ports:
      - "3000:3000"

  postgres_db:
    restart: always
    build: ./services/postgresql
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vulnerablenode"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
